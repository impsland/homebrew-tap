name: Update casks

# Copies each app's cask from its latest GitHub release (the release workflow attaches it), so the
# app repositories need no credentials for this tap.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Imp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo impsland/imp --pattern imp.rb --output "$RUNNER_TEMP/imp.rb" --clobber
          grep -q '^cask "imp" do$' "$RUNNER_TEMP/imp.rb"
          ruby -c "$RUNNER_TEMP/imp.rb"
          mkdir -p Casks
          mv "$RUNNER_TEMP/imp.rb" Casks/imp.rb

      - name: Commit
        run: |
          git add Casks
          git diff --cached --quiet && exit 0
          # Commits are credited to the tap's maintainer (GitHub's no-reply address for arthuqa).
          git config user.name "Art"
          git config user.email "157759405+arthuqa@users.noreply.github.com"
          git commit -m "Update casks from the latest releases"
          git push
